namespace:
  create: true
  name: setup

image:
  repository: 771960604435.dkr.ecr.eu-west-1.amazonaws.com/workshop-images/deployer
  tag: "latest"
  pullPolicy: IfNotPresent
  pullSecrets: []

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

secret:
  create: true
  name: workshop-deployer-secret
  apiKey: ""

env:
  workdir: "/cargo-cats"
  nsPrefix: "demo-"

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "300m"
    memory: "256Mi"

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  host: ""
  path: "/"
  pathType: "Prefix"

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}
